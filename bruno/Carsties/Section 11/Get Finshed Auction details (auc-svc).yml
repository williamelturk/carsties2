info:
  name: Get Finshed Auction details (auc-svc)
  type: http
  seq: 12

http:
  method: GET
  url: "{{gateway}}/auctions/{{createdItemId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Status should be ReserveNotMet", function () {
            expect(jsonData.status).to.eq('ReserveNotMet');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
