info:
  name: Get Created Auction details (auction-svc)
  type: http
  seq: 10

http:
  method: GET
  url: "{{gateway}}/auctions/{{createdItemId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Response body had current high eq 200", function () {
            expect(jsonData.currentHighBid).to.eq(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
