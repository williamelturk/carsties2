info:
  name: Get Created Auction details (auc-svc)
  type: http
  seq: 9

http:
  method: GET
  url: "{{gateway}}/auctions/{{createdItemId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Response body had current high bid > 0", function () {
            expect(jsonData.currentHighBid).to.be.above(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
