info:
  name: Get Item updated from search svc
  type: http
  seq: 4

http:
  method: GET
  url: "{{searchApi}}/api/search/{{createdItemId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test('Status code is 200', function() {
            expect(res.getStatus()).to.equal(200);
        })

        test('Make is Ford', function() {
            expect(jsonData.make).to.eq('Ford');
        })

        test('Model is set to Updated', function() {
            expect(jsonData.model).to.eq('Updated');
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
