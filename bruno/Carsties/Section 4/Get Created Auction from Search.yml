info:
  name: Get Created Auction from Search
  type: http
  seq: 3

http:
  method: GET
  url: "{{searchApi}}/api/search/{{createdItemId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test('Status code is 200', function() {
            expect(res.getStatus()).to.equal(200);
        })

        var createdModel = bru.getVar('createdModel');

        test('Make is Ford and model is ' + createdModel, function() {
            expect(jsonData.make).to.eq('Ford');
            expect(jsonData.model).to.eq(createdModel);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
