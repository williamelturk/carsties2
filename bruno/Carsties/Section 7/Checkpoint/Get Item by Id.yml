info:
  name: Get Item by Id
  type: http
  seq: 8

http:
  method: GET
  url: "{{gateway}}/search/{{createdItemId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test('Status code is 200', function() {
            expect(res.getStatus()).to.equal(200);
        })

        test('Item has correct make of Ford', function() {
            expect(jsonData.make).to.eq('Ford');
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
