  type: http
  seq: 10

http:
  method: PUT
  url: "{{gateway}}/auctions/{{createdItemId}}"
  body:
    type: json
    data: |-
      {
          "model": "Updated"
      }
  auth:
    type: bearer
    token: "{{AliceToken}}"

runtime:
