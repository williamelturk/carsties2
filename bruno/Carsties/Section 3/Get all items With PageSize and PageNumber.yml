info:
  name: Get all items With PageSize and PageNumber
  type: http
  seq: 4

http:
  method: GET
  url: "{{searchApi}}/api/search?pageNumber=3&pageSize=2"
  params:
    - name: pageNumber
      value: "3"
      type: query
    - name: pageSize
      value: "2"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test('Status code is 200', function() {
            expect(res.getStatus()).to.equal(200);
        })

        test('Result includes results, pagecount and totalcount properties', function() {
            expect(jsonData).to.haveOwnProperty('results');
            expect(jsonData).to.haveOwnProperty('pageCount');
            expect(jsonData).to.haveOwnProperty('totalCount');
        });

        test('results count to eq 2', function() {
            expect(jsonData.results.length).to.eq(2);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
