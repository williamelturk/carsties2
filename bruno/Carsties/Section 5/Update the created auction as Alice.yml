info:
  name: Update the created auction as Alice
  type: http
  seq: 8

http:
  method: PUT
  url: "{{auctionApi}}/api/auctions/{{createdItemId}}"
  body:
    type: json
    data: |-
      {
          "model": "Updated"
      }
  auth:
    type: bearer
    token: "{{AliceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('Status code is 204 No Content', function() {
            expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
