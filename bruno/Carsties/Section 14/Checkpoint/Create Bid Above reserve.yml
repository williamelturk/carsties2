info:
  name: Create Bid Above reserve
  type: http
  seq: 12

http:
  method: POST
  url: "{{api-carsties}}/bids?auctionId={{createdItemId}}&amount=200"
  params:
    - name: auctionId
      value: "{{createdItemId}}"
      type: query
    - name: amount
      value: "200"
      type: query
  auth:
    type: bearer
    token: "{{TomToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        var jsonData = res.getBody();

        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Bid status is Accepted", function () {
            expect(jsonData).to.haveOwnProperty('bidStatus');
            expect(jsonData.bidStatus).to.eq('Accepted');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
